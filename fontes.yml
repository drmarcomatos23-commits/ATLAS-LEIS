# Fontes coletadas pelo ATLAS-LEIS. `upstream: true` = já coberto pelo ctresb/leis (não duplicar).
sapl:
  - {municipio: "São Vicente", uf: SP, url: "https://sapl.saovicente.sp.leg.br", upstream: true}
  - {municipio: "Praia Grande", uf: SP, url: "https://sapl.praiagrande.sp.leg.br"}
  - {municipio: "Guarujá", uf: SP, url: "https://sapl.guaruja.sp.leg.br", ativo: false}
  - {municipio: "Cubatão", uf: SP, url: "https://sapl.cubatao.sp.leg.br", ativo: false, obs: "SAPL sem normas cadastradas (nov/2026)"}
  - {municipio: "Bertioga", uf: SP, url: "https://sapl.bertioga.sp.leg.br"}
  - {municipio: "Mongaguá", uf: SP, url: "https://sapl.mongagua.sp.leg.br", ativo: false}
  - {municipio: "Itanhaém", uf: SP, url: "https://sapl.itanhaem.sp.leg.br", ativo: false}
  - {municipio: "Peruíbe", uf: SP, url: "https://sapl.peruibe.sp.leg.br", ativo: false}
  - {municipio: "Santos", uf: SP, url: "https://sapl.santos.sp.leg.br", ativo: false}

# Páginas oficiais com listas de atos (coletores/paginas.py)
paginas:
  - nome: drei
    url: "https://www.gov.br/empresas-e-negocios/pt-br/drei/legislacao/instrucoes-normativas"
    padrao: "arquivos-instrucoes-normativas-em-vigor/.+\\.pdf"
    pasta: "reguladores/drei/instrucoes-normativas"
    orgao: "DREI – Departamento Nacional de Registro Empresarial e Integração"
    tipo: "Instrução Normativa / Manual de Registro"
    prefixo_titulo: "Instrução Normativa DREI"
    situacao: "em vigor (segundo a página do DREI)"
    versao_texto: "PDF publicado pelo DREI (inclui versões atualizadas/compiladas)"
  - nome: nrs
    url: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadora/normas-regulamentadoras-vigentes"
    padrao: "normas-regulamentadoras-vigentes/.+"
    titulo_padrao: "^NR-?\\s*\\d"
    pasta: "reguladores/mte/normas-regulamentadoras"
    orgao: "Ministério do Trabalho e Emprego"
    tipo: "Norma Regulamentadora"
    versao_texto: "texto atualizado publicado pelo MTE (não substitui o DOU)"
