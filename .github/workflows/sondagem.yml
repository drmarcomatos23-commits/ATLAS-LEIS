name: Sondagem das fontes
on:
  workflow_dispatch:
  push:
    paths: ["coletores/sondagem.py"]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python coletores/sondagem.py
      - name: Gravar relatório
        run: |
          git config user.name "atlas-leis-bot"
          git config user.email "atlas-leis-bot@users.noreply.github.com"
          git add _relatorios
          git commit -m "Sondagem das fontes $(date -u +%F)" || exit 0
          git pull --rebase && git push
