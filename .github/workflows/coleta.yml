name: Coleta diária
on:
  schedule:
    - cron: "17 8 * * *"   # 05:17 em Brasília, todos os dias
  workflow_dispatch:
    inputs:
      coletor: {description: "Rodar só alguns coletores, separados por vírgula (dou, santos_do, peruibe_do, tjsp, trabalhista, paginas, sefaz_sp, santos, cnj, sapl)", required: false, default: ""}
permissions:
  contents: write
concurrency: {group: coleta, cancel-in-progress: false}
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        coletor: [dou, santos_do, peruibe_do, tjsp, trabalhista, paginas, sefaz_sp, santos, cnj, sapl]
    env:
      ATLAS_MINUTOS: "150"   # carga inicial; depois de completa, cada coletor termina em minutos
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.coletor == '' || contains(format(',{0},', inputs.coletor), format(',{0},', matrix.coletor)) }}
      - uses: actions/setup-python@v5
        if: ${{ inputs.coletor == '' || contains(format(',{0},', inputs.coletor), format(',{0},', matrix.coletor)) }}
        with: {python-version: "3.12", cache: pip}
      - if: ${{ inputs.coletor == '' || contains(format(',{0},', inputs.coletor), format(',{0},', matrix.coletor)) }}
        run: |
          sudo apt-get install -y -qq antiword poppler-utils >/dev/null
          pip install -r requirements.txt
          python coletores/${{ matrix.coletor }}.py
      - name: Gravar no acervo
        if: ${{ always() && (inputs.coletor == '' || contains(format(',{0},', inputs.coletor), format(',{0},', matrix.coletor))) }}
        run: |
          git config user.name "atlas-leis-bot"
          git config user.email "atlas-leis-bot@users.noreply.github.com"
          git add -A -- . ":(exclude)_relatorios"
          git commit -m "Coleta ${{ matrix.coletor }} $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
  boletim:
    needs: coletar
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 markdownify pypdf pyyaml
      - name: Alertas do dia (abre Issue = notificação do GitHub)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git pull -q
          python coletores/boletim.py alertas
          f="_alertas/$(date +%F).md"
          if [ -f "$f" ]; then gh issue create --title "Alerta ATLAS-LEIS $(date +%d/%m/%Y)" --body-file "$f" --label alerta || gh issue create --title "Alerta ATLAS-LEIS $(date +%d/%m/%Y)" --body-file "$f"; fi
      - name: Boletim semanal (segundas)
        run: |
          if [ "$(TZ=America/Sao_Paulo date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python coletores/boletim.py semanal; fi
      - name: Gravar
        run: |
          git config user.name "atlas-leis-bot"
          git config user.email "atlas-leis-bot@users.noreply.github.com"
          git add -A -- . ":(exclude)_relatorios"
          git commit -m "Boletim/alertas $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
