name: Coleta diária
on:
  schedule:
    - cron: "17 8 * * *"   # 05:17 em Brasília, todos os dias
  workflow_dispatch:
    inputs:
      coletor: {description: "Rodar só um coletor (dou, tjsp, santos, cnj, sapl)", required: false, default: ""}
permissions:
  contents: write
concurrency: {group: coleta, cancel-in-progress: false}
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        coletor: [dou, tjsp, santos, cnj, sapl]
    env:
      ATLAS_MINUTOS: "40"
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.coletor == '' || inputs.coletor == matrix.coletor }}
      - uses: actions/setup-python@v5
        if: ${{ inputs.coletor == '' || inputs.coletor == matrix.coletor }}
        with: {python-version: "3.12", cache: pip}
      - if: ${{ inputs.coletor == '' || inputs.coletor == matrix.coletor }}
        run: |
          sudo apt-get install -y -qq antiword >/dev/null
          pip install -r requirements.txt
          python coletores/${{ matrix.coletor }}.py
      - name: Gravar no acervo
        if: ${{ always() && (inputs.coletor == '' || inputs.coletor == matrix.coletor) }}
        run: |
          git config user.name "atlas-leis-bot"
          git config user.email "atlas-leis-bot@users.noreply.github.com"
          git add -A municipais reguladores jurisprudencia estaduais dou estado _novidades 2>/dev/null || true
          git commit -m "Coleta ${{ matrix.coletor }} $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
